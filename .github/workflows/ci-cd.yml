name: CI/CD Pipeline Case Study

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main']

# Berikan izin ke GitHub Actions untuk menulis paket ke GHCR (GitHub Container Registry)
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies & Run Tests
        run: |
          npm ci
          # Jika ada unit test, jalankan di sini: npm test

      # Step Security Scan: Trivy Vulnerability Scanner
      - name: Run Trivy Vulnerability Scanner (Repository)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'

      # Log in ke GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) untuk Docker
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build dan Push Docker Image ke GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Simulation Notice
        run: |
          echo "=================================================="
          echo " Deploying image tag: ${{ github.sha }} "
          echo " Target Environment: Non-Prod / Staging VPS "
          echo " Deployment Strategy: Rolling Update via Docker "
          echo " Status: SUCCESSFUL "
          echo "=================================================="
